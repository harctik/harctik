<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-label="kira.ai model preset sizes"><rect width="1000" height="330" rx="6" fill="#050505" stroke="#1d2210"/><text x="30" y="40" font-family="Georgia,'Times New Roman',serif" font-size="22" font-weight="700" fill="#ffffff">kira.ai: five presets, 13.8M to 2.84B parameters</text><text x="30" y="90" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#ffffff">15m</text><rect x="90" y="70" width="0" height="28" fill="#d2f843"><animate attributeName="width" values="0;70" dur="1.2s" begin="0.0s" fill="freeze"/></rect><text x="170" y="90" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#d2f843" opacity="0">13.8M<animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.1s" fill="freeze"/></text><text x="30" y="134" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#ffffff">125m</text><rect x="90" y="114" width="0" height="28" fill="#d2f843"><animate attributeName="width" values="0;286" dur="1.2s" begin="0.35s" fill="freeze"/></rect><text x="386" y="134" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#d2f843" opacity="0">91.2M<animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.4500000000000002s" fill="freeze"/></text><text x="30" y="178" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#ffffff">500m</text><rect x="90" y="158" width="0" height="28" fill="#d2f843"><animate attributeName="width" values="0;411" dur="1.2s" begin="0.7s" fill="freeze"/></rect><text x="511" y="178" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#d2f843" opacity="0">272.6M<animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.8s" fill="freeze"/></text><text x="30" y="222" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#ffffff">1b</text><rect x="90" y="202" width="0" height="28" fill="#d2f843"><animate attributeName="width" values="0;558" dur="1.2s" begin="1.0499999999999998s" fill="freeze"/></rect><text x="658" y="222" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#d2f843" opacity="0">985.7M<animate attributeName="opacity" values="0;1" dur="0.3s" begin="2.15s" fill="freeze"/></text><text x="30" y="266" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#ffffff">3b</text><rect x="90" y="246" width="0" height="28" fill="#d2f843"><animate attributeName="width" values="0;678" dur="1.2s" begin="1.4s" fill="freeze"/></rect><text x="778" y="266" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#d2f843" opacity="0">2.84B<animate attributeName="opacity" values="0;1" dur="0.3s" begin="2.5s" fill="freeze"/></text><text x="30" y="310" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#9aa38a">Bar length is log scale. Parameter counts as measured in the repo benchmark, tied weights, 8,192-token vocabulary.</text></svg>