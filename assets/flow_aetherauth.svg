<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="AetherAuth session scoring flow"><rect width="1000" height="300" rx="6" fill="#050505" stroke="#1d2210"/><text x="30" y="40" font-family="Georgia,'Times New Roman',serif" font-size="22" font-weight="700" fill="#ffffff">AetherAuth: how a session is judged</text><line x1="90" y1="150" x2="840" y2="150" stroke="#1d2210" stroke-width="3"/><circle cx="90" cy="150" r="30" fill="#050505" stroke="#d2f843" stroke-width="2"><animate attributeName="fill" values="#050505;#d2f843;#050505" dur="6s" begin="0.0s" repeatCount="indefinite" keyTimes="0;0.08;0.3"/></circle><text x="90" y="205" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#ffffff">Keystrokes</text><text x="90" y="223" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#ffffff">and cursor</text><circle cx="270" cy="150" r="30" fill="#050505" stroke="#d2f843" stroke-width="2"><animate attributeName="fill" values="#050505;#d2f843;#050505" dur="6s" begin="1.0s" repeatCount="indefinite" keyTimes="0;0.08;0.3"/></circle><text x="270" y="205" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#ffffff">Telemetry</text><text x="270" y="223" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#ffffff">every 8 s</text><circle cx="450" cy="150" r="30" fill="#050505" stroke="#d2f843" stroke-width="2"><animate attributeName="fill" values="#050505;#d2f843;#050505" dur="6s" begin="2.0s" repeatCount="indefinite" keyTimes="0;0.08;0.3"/></circle><text x="450" y="205" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#ffffff">9-engine</text><text x="450" y="223" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#ffffff">ensemble</text><circle cx="630" cy="150" r="30" fill="#050505" stroke="#d2f843" stroke-width="2"><animate attributeName="fill" values="#050505;#d2f843;#050505" dur="6s" begin="3.0s" repeatCount="indefinite" keyTimes="0;0.08;0.3"/></circle><text x="630" y="205" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#ffffff">Fusion</text><text x="630" y="223" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#ffffff">score</text><circle cx="830" cy="150" r="30" fill="#050505" stroke="#d2f843" stroke-width="2"><animate attributeName="fill" values="#050505;#d2f843;#050505" dur="6s" begin="4.0s" repeatCount="indefinite" keyTimes="0;0.08;0.3"/></circle><text x="830" y="205" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#ffffff">Allow or</text><text x="830" y="223" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#ffffff">step-up</text><circle r="6" cy="150" fill="#d2f843"><animate attributeName="cx" values="90;830" dur="5s" begin="0.0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" dur="5s" begin="0.0s" repeatCount="indefinite"/></circle><circle r="6" cy="150" fill="#d2f843"><animate attributeName="cx" values="90;830" dur="5s" begin="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" dur="5s" begin="1.6s" repeatCount="indefinite"/></circle><circle r="6" cy="150" fill="#d2f843"><animate attributeName="cx" values="90;830" dur="5s" begin="3.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" dur="5s" begin="3.2s" repeatCount="indefinite"/></circle><text x="30" y="270" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#9aa38a">Drift across consecutive checks triggers a step-up challenge instead of a lockout.</text></svg>